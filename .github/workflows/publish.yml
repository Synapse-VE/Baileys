name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Enable Corepack
        run: |
          command -v corepack >/dev/null || npm install -g corepack@latest
          corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Lint and test
        run: |
          yarn lint
          yarn test

      - name: Publish to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The token is written to an ephemeral runner npmrc; consumers do
          # not need authentication because the package is public.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            TAG=next
          else
            TAG=latest
          fi
          npm publish --access public --tag "$TAG"

      - name: Smoke the published package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # npm accepts the publish before the public registry has the new
          # version. Poll the write endpoint (which bypasses the negative CDN
          # cache) for up to 10 minutes, then install with a fresh metadata
          # fetch.
          READY=0
          for attempt in $(seq 1 40); do
            if curl -fsS "https://registry.npmjs.org/@synapse-ve%2fbaileys?write=true" >/dev/null; then
              READY=1
              break
            fi
            sleep 15
          done
          if [[ "$READY" != "1" ]]; then
            echo "npm registry never exposed the package metadata" >&2
            exit 1
          fi

          INSTALLED=0
          for attempt in 1 2 3 4 5; do
            if npm install --prefer-online --prefix .pkg-smoke "@synapse-ve/baileys@${VERSION}" --no-fund --no-audit --registry=https://registry.npmjs.org; then
              INSTALLED=1
              break
            fi
            sleep 15
          done
          if [[ "$INSTALLED" != "1" ]]; then
            echo "published package was not installable from npmjs" >&2
            exit 1
          fi
          node --input-type=module -e "import('./.pkg-smoke/node_modules/@synapse-ve/baileys/lib/index.js').then(m => { if (typeof m.makeWASocket !== 'function') throw new Error('makeWASocket missing') })"

      - name: Create GitHub release
        run: |
          # rc/sync tags are prereleases; only a stable tag (no hyphen) becomes
          # the repository's Latest release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --latest --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@synapse-ve'

      - name: Enable Corepack
        run: |
          command -v corepack >/dev/null || npm install -g corepack@latest
          corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Lint and test
        run: |
          yarn lint
          yarn test

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke the published package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if npm install --prefix .pkg-smoke "@synapse-ve/baileys@${VERSION}" --no-fund --no-audit; then
              break
            fi
            sleep 15
          done
          node --input-type=module -e "import('./.pkg-smoke/node_modules/@synapse-ve/baileys/lib/index.js').then(m => { if (typeof m.makeWASocket !== 'function') throw new Error('makeWASocket missing') })"

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Feature Watch

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Scan the live bundle
        id: scan
        continue-on-error: true
        run: node scripts/feature-watch.mjs | tee feature-watch.txt

      - name: Open an issue when post-quantum starts being used
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The WhatsApp Web bundle now uses the post-quantum handshake fields."
            echo
            echo '```'
            cat feature-watch.txt
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md
          gh issue create --title "PQ handshake activated in the WhatsApp Web bundle" --body-file issue-body.md

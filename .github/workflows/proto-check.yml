name: Proto Pipeline

on:
  pull_request:

jobs:
  proto-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Enable Corepack
        run: corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Regression tests
        run: |
          yarn test:proto
          yarn test:scripts

      - name: Generate statics from the repository root
        run: yarn gen:protobuf

      - name: Committed statics must match the proto
        run: git diff --exit-code -- WAProto/index.js WAProto/index.d.ts

      - name: Reject proto3-invalid required fields
        run: |
          if grep -nE '^[[:space:]]*required ' WAProto/WAProto.proto; then
            echo "WAProto.proto contains 'required', which is invalid in proto3"
            exit 1
          fi

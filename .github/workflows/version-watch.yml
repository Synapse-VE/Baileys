name: Version Watch

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Update advertised version
        run: yarn update:version

      - name: Update protocol status
        run: node scripts/protocol-status.mjs

      - name: Lint
        run: yarn lint

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/version
          delete-branch: true
          title: 'chore(version): update WhatsApp Web version'
          commit-message: 'chore(version): update WhatsApp Web version'
          body: |
            Automated bump of the WhatsApp Web version advertised by the client.

            The workflow already ran `yarn lint`.

      - name: Open an issue when the bump fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Version watch failed" \
            --body "The scheduled version bump failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

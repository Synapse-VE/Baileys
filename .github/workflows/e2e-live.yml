name: E2E Live

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'JID destino del mensaje de prueba (ej. 1234567890@s.whatsapp.net)'
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Enable Corepack
        run: |
          command -v corepack >/dev/null || npm install -g corepack@latest
          corepack enable

      - name: Install packages
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Decode auth state
        run: |
          if [ -z "${{ secrets.E2E_AUTH_B64 }}" ]; then
            echo "E2E_AUTH_B64 is not configured, the smoke will skip"
            exit 0
          fi
          mkdir -p .e2e-auth
          printf '%s' "${{ secrets.E2E_AUTH_B64 }}" | base64 -d | tar -xz -C .e2e-auth

      - name: Run live smoke
        env:
          E2E_AUTH_DIR: .e2e-auth
          E2E_TARGET: ${{ inputs.target }}
        run: node scripts/e2e-live.mjs
